<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebook Search</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet" />
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .fade-in {
        animation: fadeIn 1s;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header class="bg-white shadow p-4">
      <div class="container mx-auto">
        <h1 class="text-xl font-semibold text-gray-700">Notebook v1.0</h1>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto mt-8">
      <div class="relative">
        <input
          type="text"
          id="searchInput"
          class="w-full h-12 px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          placeholder="Type your query and hit enter..."
        />
      </div>
      <div id="searchResults" class="mt-8">
        <!-- Search result list items -->
      </div>
      <div class="mt-8">
        <!-- Pagination -->
        <nav class="flex justify-center">
          <ul class="flex list-none">
            <li class="mx-1">
              <button
                class="px-4 py-2 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-100"
              >
                1
              </button>
            </li>
            <!-- More pages -->
          </ul>
        </nav>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow p-4 mt-8">
      <div class="container mx-auto text-center">
        <p class="text-gray-600">$FOOTER_TEXT_PLACEHOLDER</p>
      </div>
    </footer>

    <!-- Back to Top Button -->
    <button
      id="backToTop"
      class="fixed right-4 bottom-4 px-3 py-2 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded shadow hover:bg-gray-100"
    >
      Back to Top
    </button>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 z-50 w-64 h-full p-4 bg-white shadow-lg transform -translate-x-full">
      <button id="closeSidebar" class="absolute right-4 top-4">&times;</button>
      <h2 class="mb-4 text-xl font-semibold text-gray-700">Browsing History</h2>
      <!-- Browsing history list items -->
    </aside>
    <!--<button id="openSidebar"
    class="fixed top-4 left-4 px-3 py-2 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded shadow hover:bg-gray-100">History</button>-->

    <!-- JavaScript -->
    <script>
      function debounce(func, wait) {
        let timeout
        return function () {
          const context = this
          const args = arguments
          clearTimeout(timeout)
          timeout = setTimeout(function () {
            func.apply(context, args)
          }, wait)
        }
      }

      /*document.getElementById("openSidebar").addEventListener("click", function () {
      document.getElementById("sidebar").classList.add("translate-x-0");
    });*/
      document.getElementById('closeSidebar').addEventListener('click', function () {
        document.getElementById('sidebar').classList.remove('translate-x-0')
      })
      document.getElementById('backToTop').addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' })
      })

      document.getElementById('searchInput').addEventListener(
        'keyup',
        debounce(function (event) {
          if (event.key === 'Enter') {
            showLoadingAnimation()
          }
        }, 500),
      )

      function showLoadingAnimation() {
        const searchResults = document.getElementById('searchResults')
        searchResults.innerHTML = "<div class='loader'></div>"
        setTimeout(() => {
          searchResults.innerHTML = ''
          // Add the search result list items after the loading animation ends
          for (let i = 0; i < 10; i++) {
            searchResults.innerHTML += `
                        <div class="mb-4">
                            <h2 class="text-lg font-semibold text-gray-800">File Name</h2>
                            <p class="text-gray-600">One-sentence summary</p>
                            <p class="text-sm text-gray-500">Last update: MM-DD-YYYY</p>
                        </div>`
          }
        }, 1000)
      }

      showLoadingAnimation()
    </script>
  </body>
</html>

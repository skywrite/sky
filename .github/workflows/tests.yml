name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only the dedicated browser job needs Chromium; it installs the pinned browser explicitly.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  checks:
    name: lint, typecheck, fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        working-directory: src
        run: bun install --frozen-lockfile
      - name: Format check
        working-directory: src
        run: bun run dev:fmt:check
      - name: Lint
        working-directory: src
        run: bun run dev:lint
      - name: Typecheck
        working-directory: src
        run: bun run dev:typecheck

  cli:
    name: cli tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        working-directory: src
        run: bun install --frozen-lockfile
      - name: Run cli tests (everything except service/ and e2e)
        working-directory: src
        run: bun run dev:test:cli

  web:
    name: web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        working-directory: src
        run: bun install --frozen-lockfile
      - name: Run service tests (HTTP handlers, websocket, GraphQL)
        working-directory: src
        run: bun run dev:test:web

  browser:
    name: protected browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        run: bunx --no-install playwright install --with-deps chromium
      # Keep chromiumSandbox enabled. Ubuntu needs an explicit user-namespace grant for this binary.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Allow the test browser to use its sandbox
        run: |
          browser_path="$(bun -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile sky-test-chromium "%s" flags=(unconfined) {\n  userns,\n}\n' "$browser_path" | sudo tee /etc/apparmor.d/sky-test-chromium > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/sky-test-chromium
      - name: Run protected browser and LinkedIn import tests
        run: bun run dev:test:browser:security

  web-browser:
    name: web browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        run: bunx --no-install playwright install --with-deps chromium
      # The same user-namespace grant the protected browser job needs; see the note there.
      - name: Allow the test browser to use its sandbox
        run: |
          browser_path="$(bun -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile sky-test-chromium "%s" flags=(unconfined) {\n  userns,\n}\n' "$browser_path" | sudo tee /etc/apparmor.d/sky-test-chromium > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/sky-test-chromium
      - name: Run the web app's browser tests (service/handler e2e)
        run: bun run dev:test:web:browser

  vscode:
    name: vscode extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: extensions/vscode/.nvmrc
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      # The extension's shared/ and lib/ are symlinks into src/, and modules
      # loaded through them resolve their npm deps from src/node_modules
      # (realpath-based resolution) — so src needs its install too.
      - name: Install src dependencies
        working-directory: src
        run: bun install --frozen-lockfile
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      # Typecheck + stripcheck + depparity + syncTitles — fast static gates
      # before the slower VS Code download.
      - name: Run extension checks
        working-directory: extensions/vscode
        run: npm run check
      # Downloads stable VS Code (no local install on the runner) and drives it
      # under a virtual display.
      - name: Run extension tests
        working-directory: extensions/vscode
        run: xvfb-run -a npm test

  security:
    name: security (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # bun audit reads the lockfile and queries the advisory DB — no install
      # step needed. Fails on any known vulnerability in the locked deps.
      - name: Audit src dependencies
        working-directory: src
        run: bun audit
      - name: Audit root workspace
        run: bun audit

  # A reusable workflow can only be called at the job level, so this sits
  # beside the bun-audit job rather than inside it. Scans every lockfile in
  # the repo (root and src bun.lock, the vscode extension's package-lock.json)
  # against OSV, which includes the MAL- malicious-package advisories that
  # bun audit's advisory DB lacks.
  osv-scanner:
    name: security (osv-scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    # security-events: write is needed to upload SARIF findings to the repo's
    # Security → Code scanning tab; widens the workflow-level contents:read
    # for this job only.
    permissions:
      actions: read
      security-events: write
      contents: read
    with:
      scan-args: |-
        --recursive
        ./
